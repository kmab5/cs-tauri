[package]
name = "cs-tauri"
version = "0.3.5"
description = "A ChoiceScript player for the desktop. Games and saves stay on your own machine."
authors = ["kmab5"]
edition = "2021"
rust-version = "1.77.2"

# The binary is a thin shim; everything lives in the library so tests can reach
# it and so the mobile entry points would work unchanged if they are ever added.
[lib]
name = "choicescript_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset serves game images straight off disk. Without it every
# *text_image in a game resolves to a URL the webview refuses to load.
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# default-features = false drops the bzip2 and zstd C dependencies. ChoiceScript
# archives are deflate; nothing published uses anything else.
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
